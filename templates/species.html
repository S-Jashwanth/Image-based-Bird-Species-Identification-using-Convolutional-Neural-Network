{% extends 'base.html' %}

{% block contents %}
<section class="py-5">
  <div class="container">
    <div class="text-center mb-4">
      <h1 class="fw-bold fs-3 mb-2">Species Directory</h1>
      <p class="text-muted small max-w-lg mx-auto">
        Complete catalog of all {{ total_species }} bird species recognized by the model.
      </p>

      <!-- Search Filter Bar -->
      <div class="row justify-content-center mt-3">
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-search text-muted"></i>
            </span>
            <input type="text" id="speciesSearchInput" class="form-control border-start-0" placeholder="Filter species (e.g. Eagle, Owl, Falcon)..." autocomplete="off">
          </div>
          <div class="text-muted small mt-1 text-end" style="font-size: 0.75rem;">Showing {{ species_list|length }} species</div>
        </div>
      </div>
    </div>

    <!-- Species Grid (Names & Google Search Only - No Index Numbers) -->
    <div class="row g-2" id="speciesGrid">
      {% for idx, name in species_list %}
      <div class="col-6 col-sm-4 col-md-3 col-lg-2 species-item-card" data-name="{{ name }}">
        <div class="border rounded-2 p-2 bg-white text-center h-100 d-flex flex-column justify-content-between">
          <div class="fw-semibold small text-truncate mb-1" title="{{ name }}">{{ name }}</div>
          <a href="https://www.google.com/search?q={{ name|urlencode }}+bird" target="_blank" rel="noopener noreferrer" class="small text-muted text-decoration-none" style="font-size: 0.75rem;">
            Google Search &nearr;
          </a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
